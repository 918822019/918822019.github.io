<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>918822019 | 个人技术博客</title>
    <link rel="stylesheet" href="/assets/styles.css?v=20260410-2" />
  </head>
  <body>
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>
    <div class="grain"></div>

    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/">918822019</a>
        <div class="top-actions">
          <button id="theme-toggle" class="menu-btn" aria-label="切换主题">夜间</button>
          <button id="sidebar-toggle" class="menu-btn" aria-label="打开目录">目录</button>
        </div>
      </div>
    </header>

    <main class="page">
      <section class="hero reveal">
        <p class="eyebrow">PERSONAL BLOG</p>
        <h1>记录 AI、数学与工程实践</h1>
        <p class="hero-desc">
          这里是我的技术笔记花园，持续沉淀模型、RAG、搜索与系统化学习过程。
        </p>
        <div class="hero-actions">
          <button id="random-post" class="hero-btn">随机看一篇</button>
          <a class="hero-link" href="https://github.com/918822019/918822019.github.io" target="_blank" rel="noopener noreferrer">查看仓库</a>
        </div>
        <div class="stats" id="stats">
          <div class="stat-card">
            <span class="stat-value" id="stat-files">-</span>
            <span class="stat-label">文档数</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="stat-folders">-</span>
            <span class="stat-label">分类数</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="stat-updated">刚刚</span>
            <span class="stat-label">最后更新</span>
          </div>
        </div>
      </section>

      <section class="content-grid">
        <aside class="sidebar" id="sidebar" aria-label="目录侧边栏">
          <div class="panel reveal">
            <h2>文档目录</h2>
            <div class="search-row">
              <input id="doc-search" placeholder="搜索标题或路径" aria-label="搜索文档" />
            </div>
            <nav id="doc-tree" class="doc-tree" aria-label="文档树">
              <p class="loading">正在加载目录...</p>
            </nav>
          </div>
        </aside>

        <section class="main-feed">
          <div class="panel reveal command-panel">
            <div class="panel-head">
              <h2>一键更新命令</h2>
            </div>
            <p class="muted">在仓库根目录执行以下命令，可自动更新目录并推送到 <code>doc</code>：</p>
            <pre class="cmd-block" id="publish-cmd"><code>bash scripts/publish-doc.sh "docs: update notes"</code></pre>
            <div class="cmd-actions">
              <button class="menu-btn" id="copy-cmd">复制命令</button>
              <span class="muted" id="copy-tip">可直接粘贴到终端执行</span>
            </div>
          </div>

          <div class="panel reveal">
            <div class="panel-head">
              <h2>精选文章</h2>
              <span class="muted" id="feed-count">0 篇</span>
            </div>
            <div id="featured-posts" class="featured-posts"></div>
          </div>

          <div class="panel reveal">
            <div class="panel-head">
              <h2>全部文章</h2>
              <div id="tag-filter" class="tags"></div>
            </div>
            <div id="all-posts" class="post-list"></div>
          </div>
        </section>
      </section>
    </main>

    <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>
    <button id="to-top" class="to-top" aria-label="回到顶部">↑</button>

    <footer class="site-footer">
      <div class="footer-inner">© 2026 918822019 · Built with GitHub Pages</div>
    </footer>

    <script src="/assets/app.js?v=20260410-2"></script>
  </body>
</html>
