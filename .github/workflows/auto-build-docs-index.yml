name: Auto Build Docs Index

on:
  push:
    branches: [ main, doc ]
  workflow_dispatch: { }

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate-docs-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Show Node/npm version
        run: |
          node -v
          npm -v

      - name: Install dependencies (if any)
        run: |
          # 目前脚本不依赖额外 npm 包，仅预留接口
          npm ci || true

      - name: Build docs index
        run: |
          node scripts/build-docs-index.js

      - name: Commit and push updated docs/index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.json
          if git diff --cached --quiet; then
            echo "No changes in docs/index.json"
            exit 0
          fi
          git commit -m "chore: regenerate docs/index.json"
          git push
