<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>起点搜书</title>
    <link href="/static/style.css" rel="stylesheet">
</head>
<body>
<h1>起点搜书</h1>
<input id="query" placeholder="输入关键词" type="text">
<button onclick="search()">搜索</button>
<div id="results"></div>
<script>
    async function search() {
        const query = document.getElementById('query').value;
        const res = await fetch('/recommend', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({query})
        });
        const data = await res.json();
        document.getElementById('results').innerHTML = data.map(book => `
                <div>
                    <h3>${book.name}</h3>
                    <p>作者：${book.author}</p>
                    <p>简介：${book.description}</p>
                    <p>推荐理由：${book.reason}</p>
                    <a href="${book.link}">查看详情</a>
                </div>
            `).join('');
    }
</script>
</body>
</html>
